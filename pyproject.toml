[project]
name = "role-set"
version = "0.1.0"
description = "A generator for role-shaping training data: plans every slot, writes through a model on a rented pod, and passes each item through the same gates the humans use."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[project.scripts]
role-set = "role_set.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/role_set"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=role_set --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["role_set"]
