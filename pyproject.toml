[project]
name = "role-set"
version = "0.1.0"
description = "Prototype. Plans role-shaping items, writes them through a loopback model, and records the gates each item passed. Nothing it writes is training data until a person checks it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "aspire-si-gates @ git+https://github.com/mcp-tool-shop-org/aspire-si@388a6bcbd54cf4811b7053bd32734158c7d71a10#subdirectory=packages/aspire-si-gates",
]

[project.scripts]
role-set = "role_set.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/role_set"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=role_set --cov-report=term-missing --cov-fail-under=90"
markers = [
    "sweep: exhaustive T10 builds, run in CI without coverage",
]

[tool.coverage.run]
source = ["role_set"]
