[project]
name = "role-set"
version = "0.3.0"
description = "Prototype. Plans role-shaping items, writes the parts a writer should write, records the gates each item passed, and builds kind B puzzles in code that are proven before a model words them. Nothing it writes is training data until a person checks it."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcp-tool-shop" }]
keywords = ["dataset-generation", "puzzles", "synthetic-data", "constraint-satisfaction", "role-training", "logic-puzzles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aspire-si-gates==1.7.6",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/role-set/"
Repository = "https://github.com/mcp-tool-shop-org/role-set"
Changelog = "https://github.com/mcp-tool-shop-org/role-set/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/role-set/issues"

[project.scripts]
role-set = "role_set.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "zstandard==0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/role_set"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not sweep' --cov=role_set --cov=scripts/toolcount --cov-report=term-missing --cov-fail-under=90"
markers = [
    "sweep: exhaustive T10 builds, run in CI without coverage",
]

[tool.coverage.run]
source = ["role_set", "scripts/toolcount"]
