summary: "role-set plans every slot of a role-shaping batch, has a loopback model write only the writer's parts, and passes each item through aspire-si's gates. It never rents a pod."
boundaries:
  - name: assets
    globs:
      - assets/**
    role: data
  - name: .github
    globs:
      - .github/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: roles
    globs:
      - roles/**
    role: data
  - name: site
    globs:
      - site/**
    role: docs
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
  - name: root
    globs:
      - "*"
    role: config
