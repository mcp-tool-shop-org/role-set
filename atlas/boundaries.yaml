summary: "role-set plans every slot of a role-shaping batch, has a model on a rented pod write only the writer's parts, and passes each item through aspire-si's gates."
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: roles
    globs:
      - roles/**
    role: data
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
  - name: root
    globs:
      - "*"
    role: config
