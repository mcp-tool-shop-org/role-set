# Standards compliance
#
# PIN_PER_STEP: 2. uv.lock pins the packages. Actions are pinned by commit sha.
#   Atlas is pinned to 1.24.0. The coverage floor in pyproject.toml is 90.
#   Codecov project and patch targets are 90% with a 1% threshold.
# ANDON_AUTHORITY: 2. pytest --cov-fail-under (including the committed variety
#   record check), the workflow_dispatch sweep job, and the atlas
#   check are required gates. A red step fails the job.
#   The Codecov upload uses fail_ci_if_error: false so a private repo's upload
#   cannot block the gate.
# NAMED_COMPENSATORS: 2. This workflow checks out the repo and runs tests. It
#   does not publish, deploy, or write outside the runner. Undo is to close the
#   pull request. Owner: the author of the pull request. The Publisher merges.
# DECOMPOSE_BY_SECRETS: 2. One push-triggered workflow: test and the atlas check.
# UNCERTAINTY_GATED_HUMANS: 2. A failing check stops the merge. R&D reviews the
#   pull request. The Publisher merges.
# EXTERNAL_VERIFIER: n/a. No specialised claim is decided here.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "roles/**"
      - "docs/**"
      - "atlas/**"
      - "scripts/**"
      - "codecov.yml"
      - ".github/workflows/**"
  # Every pull request, whatever its base: stacked PRs (#88, #89) never ran CI under a main-only filter (R&D,
  # 2026-10-17), and a required check runs on every PR (github-actions rule, amended 2026-09-30).
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the suite ran 13 min before the window-script and lock tests (2026-10-17); 15 cut it off
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -m "not sweep" -n auto --cov-report=xml --durations=20 -o faulthandler_timeout=240

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage.xml

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Plan without a model
        run: uv run role-set plan --lessons T02,T03 --seed 0 --out /tmp/plan.json

      - name: Puzzle check on a fixture
        run: uv run role-set puzzle-check tests/fixtures/puzzle-check/sample.jsonl

  sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Sweep
        run: uv run pytest -m sweep --no-cov -n auto -s
